<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>GOLISEO — Babylon driven by the wasm simulation (#328)</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #0b0e14;
                color: #dfe6f2;
                font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            }
            #canvas {
                width: 100%;
                height: 100%;
                display: block;
                touch-action: none;
                outline: none;
            }
            #status {
                position: fixed;
                top: 0;
                left: 0;
                padding: 6px 10px;
                background: rgba(0, 0, 0, 0.55);
                white-space: pre;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="status">booting</div>
        <script>
            // MUST come before simhost.js. The Emscripten glue opens with
            // `var Module = typeof Module != "undefined" ? Module : {}`, so a
            // Module declared here is adopted and one declared afterwards is
            // discarded. `--payload` selects the callable-module entry point:
            // without it the binary runs the 7201-tick determinism fixture on
            // this thread instead, which is the worker's job, not the
            // renderer's.
            var Module = {
                arguments: ["--payload"],
                print: function (text) {
                    (window.__GC_SIMHOST__ = window.__GC_SIMHOST__ || []).push(String(text));
                },
                printErr: function (text) {
                    (window.__GC_SIMHOST__ = window.__GC_SIMHOST__ || []).push(
                        "ERR: " + String(text),
                    );
                },
                onAbort: function (what) {
                    (window.__GC_SIMHOST__ = window.__GC_SIMHOST__ || []).push(
                        "ABORT: " + String(what),
                    );
                },
            };
        </script>
        <script src="vendor/babylon.js"></script>
        <script src="vendor/babylonjs.loaders.min.js"></script>
        <script src="frame_payload.js"></script>
        <script src="scene.js"></script>
        <script src="simhost.js"></script>
        <script src="wasm_bench.js"></script>
    </body>
</html>
