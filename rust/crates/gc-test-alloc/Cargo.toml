[package]
name = "gc-test-alloc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Deliberately no `[lints] workspace = true` here. The workspace's
# `unsafe_code = "forbid"` (`v2/rust/Cargo.toml`'s `[workspace.lints.rust]`)
# is a per-package Cargo lint, not a workspace-wide one, so a package that
# does not opt into `workspace = true` does not inherit it. This crate exists
# solely to hold the one `unsafe impl GlobalAlloc` the allocation-budget
# tests need, so that `gc-sim` (and every other product crate) can keep
# forbidding unsafe code outright. See `crates/gc-sim/tests/env_budget.rs`.
#
# This crate ships no unsafe outside that one wrapper, is a
# `[dev-dependencies]`-only dependency of `gc-sim` (never a normal
# dependency, so it never enters a shipping build), and is not itself part
# of the simulation.

