[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[workspace.dependencies]
gc-core = { path = "crates/gc-core" }
gc-data = { path = "crates/gc-data" }
gc-sim = { path = "crates/gc-sim" }
gc-render = { path = "crates/gc-render" }
gc-netcode = { path = "crates/gc-netcode" }
# Dev-only counting global allocator (see crates/gc-test-alloc). Deliberately
# not `[lints] workspace = true`, so it does not inherit `unsafe_code =
# "forbid"` -- it exists to hold the one `unsafe impl GlobalAlloc` the
# allocation-budget tests need. Consumed only via `[dev-dependencies]`.
gc-test-alloc = { path = "crates/gc-test-alloc" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# The sim must not iterate a hash map: iteration order is not part of the
# contract and a desync is the failure mode. Use Vec or IndexMap.
disallowed_types = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
