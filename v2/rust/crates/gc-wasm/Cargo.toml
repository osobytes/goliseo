[package]
name = "gc-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `cdylib` is the artifact `wasm-bindgen`/`wasm-pack` post-process into the
# browser/node module; `rlib` keeps this crate usable as an ordinary Rust
# dependency (native `cargo test` for its non-wasm-bindgen logic, and so a
# future crate can depend on it without linking a cdylib).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gc-core.workspace = true
gc-data.workspace = true
gc-sim.workspace = true
gc-render.workspace = true
gc-netcode.workspace = true
# Pinned to the exact `wasm-bindgen-cli` binary installed in this
# environment (`wasm-bindgen --version` => 0.2.118). The CLI refuses to
# process a module built against any other 0.2.x: it checks the schema
# version stamped into the wasm custom section against its own version
# exactly, not semver-compatibly. Bump both together, never one alone.
wasm-bindgen = "=0.2.118"

# Deliberately NOT `[lints] workspace = true`. The workspace's
# `unsafe_code = "forbid"` (`v2/rust/Cargo.toml`'s `[workspace.lints.rust]`)
# is a per-package Cargo lint, not a workspace-wide one, so a package that
# does not opt into `workspace = true` does not inherit it -- the same
# mechanism `crates/gc-test-alloc/Cargo.toml` documents and uses.
#
# This crate's `render_export` module needs `#[unsafe(no_mangle)]` on its
# raw, non-wasm-bindgen per-frame exports (see that module's doc for why the
# per-frame render path is raw at all): Rust 2024 requires the `unsafe`
# wrapper on that attribute specifically because an un-namespaced exported
# symbol is a linker-level hazard, and `forbid(unsafe_code)` -- correctly --
# treats that token as unsafe code, regardless of whether the function body
# itself does anything memory-unsafe (this crate's exports do not; every
# operation inside them is a safe `Vec`/`RefCell` operation, see
# `render_export.rs` and `registry.rs`). Every other workspace rust/clippy
# lint this crate would otherwise inherit is reproduced explicitly below,
# unchanged, so nothing else is relaxed by this opt-out.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
disallowed_types = "deny"
