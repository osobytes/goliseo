name: Gate toolchain
description: >
    The pinned toolchain and build caches every gate-* job shares (#594).
    One copy here instead of four hand-mirrored step lists in ci.yml, for
    the same reason scripts/check.sh is one script: steps that must stay
    identical should be incapable of drifting apart. Every download is the
    exact pinned, hash-verified asset the pre-split gate job installed;
    scripts/check.sh's `toolchain pins` stage re-verifies each version at
    runtime, so a drift between this action and the pins is a red X, not a
    silent substitution.

inputs:
    cache-suffix:
        description: >
            Which job flavour's cargo cache to use ("static", "rust-test",
            "ts"). Separate caches per flavour because they build different
            artifact sets (clippy check-builds vs opt-level-3 test builds vs
            the release wasm target): one shared key would thrash. The three
            rust-test shards deliberately SHARE one suffix -- they compile
            the same test binaries, so the first shard to save warms the
            other two.
        required: true

runs:
    using: composite
    steps:
        # Cache restores come first so the installs below and the gate's own
        # cargo/pnpm invocations see a warm registry, target dir and store.
        # The key ends in github.sha so every run SAVES a fresh cache (the
        # restore-keys prefix restores the nearest ancestor's); a key without
        # it would freeze the target dir at the first save and let compile
        # times creep back up as the source moved on.
        - name: Restore the cargo registry and build cache
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: |
                  ~/.cargo/registry/index
                  ~/.cargo/registry/cache
                  ~/.cargo/git/db
                  rust/target
              key: cargo-${{ inputs.cache-suffix }}-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.sha }}
              restore-keys: |
                  cargo-${{ inputs.cache-suffix }}-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
                  cargo-${{ inputs.cache-suffix }}-${{ runner.os }}-

        - name: Restore the pnpm store
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.local/share/pnpm/store
              key: pnpm-${{ runner.os }}-${{ hashFiles('ts/pnpm-lock.yaml') }}
              restore-keys: pnpm-${{ runner.os }}-

        # rust/rust-toolchain.toml pins the channel (1.93), the rustfmt and
        # clippy components, and the wasm32-unknown-unknown target. rustup
        # reads that file automatically for any cargo/rustc invocation under
        # rust/; `rustup show` just forces the download to happen here, as a
        # named step, instead of silently during the first cargo call inside
        # check.sh. ubuntu-24.04 images ship rustup already; this only
        # installs it if that ever changes.
        - name: Install rustup if missing
          shell: bash
          run: |
              if ! command -v rustup >/dev/null 2>&1; then
                  curl --fail --location --retry 3 --silent --show-error \
                      https://sh.rustup.rs \
                      | sh -s -- -y --profile minimal --default-toolchain none
                  printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              fi

        - name: Select the pinned rust toolchain
          shell: bash
          working-directory: rust
          run: rustup show

        # Pinned to exactly the version crates/gc-wasm/Cargo.toml requires
        # (`wasm-bindgen = "=0.2.118"`): the CLI checks its generated glue
        # against the crate's schema version exactly, not semver, and a
        # mismatch fails opaquely inside wasm-bindgen's own codegen.
        # wasm-bindgen's releases do not publish a checksums file, so this
        # hash was computed by hand from the published asset.
        - name: Install pinned wasm-bindgen-cli
          shell: bash
          env:
              WASM_BINDGEN_VERSION: 0.2.118
              WASM_BINDGEN_SHA256: 00b519c9fc2d6e087265da1a00f29160bfcc6a823993482bc2e691910287427b
          run: |
              tool_dir="$RUNNER_TEMP/wasm-bindgen-cli"
              mkdir -p "$tool_dir"
              curl --fail --location --retry 3 --silent --show-error \
                  --output "$tool_dir/wasm-bindgen.tar.gz" \
                  "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
              echo "${WASM_BINDGEN_SHA256}  $tool_dir/wasm-bindgen.tar.gz" | sha256sum --check --status
              tar -xzf "$tool_dir/wasm-bindgen.tar.gz" -C "$tool_dir" --strip-components=1
              chmod +x "$tool_dir/wasm-bindgen"
              "$tool_dir/wasm-bindgen" --version
              printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

        # scripts/check.sh's REQUIRED_CARGO_NEXTEST_VERSION pins this
        # exactly: nextest owns which tests land in which `--partition
        # hash:I/N` shard, so two different versions across the shard jobs
        # could each skip the tests they believe the other ran. nextest
        # publishes no checksums file either; hash computed by hand from the
        # published asset, like wasm-bindgen's.
        - name: Install pinned cargo-nextest
          shell: bash
          env:
              NEXTEST_VERSION: 0.9.143
              NEXTEST_SHA256: 66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e
          run: |
              tool_dir="$RUNNER_TEMP/cargo-nextest"
              mkdir -p "$tool_dir"
              curl --fail --location --retry 3 --silent --show-error \
                  --output "$tool_dir/nextest.tar.gz" \
                  "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
              echo "${NEXTEST_SHA256}  $tool_dir/nextest.tar.gz" | sha256sum --check --status
              tar -xzf "$tool_dir/nextest.tar.gz" -C "$tool_dir"
              chmod +x "$tool_dir/cargo-nextest"
              "$tool_dir/cargo-nextest" --version
              printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

        # ts/package.json "engines" requires >= 22; the redundant determinism
        # assertion inside check.sh additionally needs
        # `node --experimental-strip-types`, stable since Node 22.6.
        - name: Install pinned Node.js
          shell: bash
          env:
              NODE_VERSION: 22.22.0
              NODE_SHA256: 9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37
          run: |
              tool_dir="$RUNNER_TEMP/node"
              mkdir -p "$tool_dir"
              curl --fail --location --retry 3 --silent --show-error \
                  --output "$tool_dir/node.tar.xz" \
                  "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
              echo "${NODE_SHA256}  $tool_dir/node.tar.xz" | sha256sum --check --status
              tar -xJf "$tool_dir/node.tar.xz" -C "$tool_dir" --strip-components=1
              "$tool_dir/bin/node" --version
              printf '%s\n' "$tool_dir/bin" >> "$GITHUB_PATH"

        # Standalone binary, not resolved through any package manager: the
        # gate must run exactly the pnpm version ts/package.json
        # ("packageManager": "pnpm@11.1.2") pins, not whatever corepack or
        # npm would otherwise resolve.
        - name: Install pinned pnpm
          shell: bash
          env:
              PNPM_VERSION: 11.1.2
              PNPM_SHA256: f82f761572d9621c5a646ccc00a1ecec4cf5839d66b714497e6ca10cd2e086ee
          run: |
              tool_dir="$RUNNER_TEMP/pnpm"
              mkdir -p "$tool_dir"
              curl --fail --location --retry 3 --silent --show-error \
                  --output "$tool_dir/pnpm.tar.gz" \
                  "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/pnpm-linux-x64.tar.gz"
              echo "${PNPM_SHA256}  $tool_dir/pnpm.tar.gz" | sha256sum --check --status
              tar -xzf "$tool_dir/pnpm.tar.gz" -C "$tool_dir"
              chmod +x "$tool_dir/pnpm"
              "$tool_dir/pnpm" --version
              printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
