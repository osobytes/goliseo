name: CI

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
    # #594. The merge queue's speculative merge commits. main's ruleset queues
    # PRs instead of requiring each to be rebased and re-gated by hand (the
    # strict up-to-date rule this replaced), and the queue only works if the
    # required gate-* jobs below run on its merge_group refs too.
    merge_group:

permissions:
    actions: read
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# THE project gate, split across parallel jobs (#594; the structural decision
# #538 measured and left open). Everything every job runs lives in
# scripts/check.sh, which each job calls exactly as a contributor would
# locally -- `./scripts/check.sh --group <g>` -- so the two cannot drift
# (AGENTS.md §9's first rule). The split itself is machine-checked from the
# script's side: check.sh's gate 0e asserts, on every run of every job, that
# this file declares one gate-<group> job per group, with exactly the
# timeout-minutes check.sh's constants state, invoking every group and no
# unknown ones, with a rust-test shard matrix of exactly 1/N..N/N. A stage
# that fell out of every job here would be a gate that silently stopped
# gating (#279's shape), and 0e is what makes that a red X instead.
#
# Wall clock: the pre-split serial gate measured ~12.5 min on a typical PR
# (of which `cargo test --workspace` was 499s -- 72%) and 31 min on
# knob-contract-heavy branches. Split, the wall clock is the slowest job:
# one rust-test shard, ~4-5 min cold and less on a warm cache.
jobs:
    # Everything cheap or compile-only: the four parity gates, fmt, and both
    # clippy targets -- plus the two self-test proofs, which run ONCE, here,
    # deliberately: check.sh --self-test is one indivisible run proving every
    # gate's red demonstrations against throwaway fixtures, and this is the
    # job with the slack to carry it (AGENTS.md §9: a gate that cannot fail
    # is worse than no gate).
    gate-static:
        name: Gate (static)
        runs-on: ubuntu-24.04
        # timeout-minutes below must equal check.sh's
        # CI_GATE_STATIC_TIMEOUT_MINUTES -- gate 0e asserts it on every run,
        # and check.sh's own wall-clock ceiling is derived from that
        # constant. See its comment for the arithmetic.
        timeout-minutes: 10

        steps:
            - name: Check out source
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Install the pinned gate toolchain
              uses: ./.github/actions/gate-toolchain
              with:
                  cache-suffix: static

            # #432/#440/#454. The live-match harness driver's real output --
            # pixel captures, and the keeper-lean COUNTS that #449, #450 and
            # #451 turn on -- needs a browser and minutes of software GL, so
            # it runs by hand and a green line here is not evidence about the
            # renderer. Gated here: the driver's verdict rules, its
            # virtual-clock arithmetic, its bootstrap invariants, and above
            # all its ANTI-DRIFT checks. That driver mirrors two TypeScript
            # files in Python -- `frame_buffer.ts`'s per-player column
            # indices and wire pose ORDER, and `action_pose.ts`'s
            # `lateralSign` formula, its 1e-6 dead band and the SAVES table
            # -- and the self-test re-derives each from its source. A mirror
            # nothing re-derives silently stops matching while the counts it
            # produces stay plausible. Starts no browser.
            #
            # scripts/check.sh does not call this self-test itself, so it
            # stays its own step here rather than being folded in. If that
            # ever changes, this step becomes a duplicate and should be
            # deleted, per AGENTS.md §9.
            - name: Check the match harness driver logic and its TypeScript mirrors (starts no browser)
              run: python3 -B scripts/browser_match_harness.py --self-test

            # A gate that cannot fail is worse than no gate (AGENTS.md §9).
            # This sabotages a set of hermetic, throwaway fixtures under
            # mktemp -- never the real rust or ts trees -- and requires every
            # one of them to be rejected, pinned to the message each targets,
            # before any of this workflow's real runs are trusted.
            - name: Prove the gate detects failure
              run: ./scripts/check.sh --self-test

            - name: Run the static gate group
              run: ./scripts/check.sh --group static

    # The workspace test suite -- the long pole the whole split exists for
    # (#594): 499s of the old 691s serial gate, and the stage that grows
    # with every knob contract. nextest's `--partition hash:I/N` splits the
    # suite deterministically across these jobs; check.sh asserts a
    # per-shard floor so a shard that silently ran almost nothing cannot
    # pass, and gate 0e asserts this matrix lists exactly 1/N..N/N so no
    # slice of the suite can fall out of every job.
    gate-rust-test:
        name: Gate (rust tests ${{ matrix.shard }})
        runs-on: ubuntu-24.04
        # Must equal check.sh's CI_GATE_RUST_TEST_TIMEOUT_MINUTES (gate 0e).
        timeout-minutes: 20
        strategy:
            # One shard's failure is still a verdict from the other two --
            # a red shard plus two greens localises a failure faster than
            # three cancelled jobs.
            fail-fast: false
            matrix:
                shard: ["1/3", "2/3", "3/3"]

        steps:
            - name: Check out source
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Install the pinned gate toolchain
              uses: ./.github/actions/gate-toolchain
              with:
                  cache-suffix: rust-test

            - name: Run the rust test shard
              run: ./scripts/check.sh --group rust-test --shard ${{ matrix.shard }}

    # The TypeScript half plus everything that needs the freshly built wasm
    # artifacts (the determinism digest, the native-vs-wasm corpus, the app
    # bundle byte-compare) -- and, appended, the real-browser peer-agreement
    # evidence, which reuses this job's build instead of paying for its own.
    gate-ts:
        name: Gate (ts)
        runs-on: ubuntu-24.04
        # Must equal check.sh's CI_GATE_TS_TIMEOUT_MINUTES (gate 0e).
        timeout-minutes: 20

        steps:
            - name: Check out source
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Install the pinned gate toolchain
              uses: ./.github/actions/gate-toolchain
              with:
                  cache-suffix: ts

            - name: Run the ts gate group
              run: ./scripts/check.sh --group ts

            # The one property no in-process fake can establish: two
            # INDEPENDENT wasm instances, connected by a real
            # RTCPeerConnection, deriving identical boundary hashes from real
            # asynchronously-delivered traffic. Every other online test in
            # this tree runs through fakes or a single instance, neither of
            # which can observe it.
            #
            # It also exercises net_inbox.rs's discipline -- JS enqueues,
            # Rust drains per tick, arrival is a tick event and never a
            # callback reaching sim state between ticks -- under REAL
            # callback timing.
            #
            # Same-engine Chrome only. The cross-engine Chrome/Firefox
            # variant needs both browser assets and is worth running less
            # often; it belongs on a schedule rather than on every push.
            #
            # Runs in THIS job, after the ts group, because gate 6 just built
            # dist/pkg-web from this checkout -- `--skip-wasm-build` reuses
            # that artifact instead of rebuilding an identical one. The
            # harness still runs its own vite build against its own config.
            - name: Install pinned browser evidence dependencies
              run: |
                  python3 -m venv "$RUNNER_TEMP/browser-evidence"
                  "$RUNNER_TEMP/browser-evidence/bin/pip" install \
                      --require-hashes \
                      --requirement scripts/browser_matrix-requirements.txt

            - name: Prove two real browser peers agree bit for bit
              run: |
                  "$RUNNER_TEMP/browser-evidence/bin/python" -B \
                      scripts/browser_online_peers.py \
                      --skip-wasm-build \
                      --output "$RUNNER_TEMP/online-peers.json"

            - name: Publish the agreement evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: online-peers
                  path: ${{ runner.temp }}/online-peers.json
                  if-no-files-found: warn

    # #469. The COMPLETE OMP-2 native rollback validation matrix (66 cases:
    # 24 from four network profiles x three seeds x {complete fixture,
    # combat}, plus 42 from three seeds x fourteen scenario/combat-load
    # cases) and the ten-case soak matrix. No browser, no GPU, no display --
    # pure CPU inside `cargo test`.
    #
    # WHY THIS IS A SEPARATE JOB AND NOT PART OF THE GATE. Measured in a
    # debug build on one local machine: 325.9s for the native matrix's 66
    # cases, of which the twelve complete-fixture cases are 310.2s; 140.7s
    # more for the soak matrix. The remaining 54 native cases cost 11.2s and
    # therefore DO run on every PR, as ordinary un-ignored tests inside the
    # rust-test group in scripts/check.sh -- the 42-case scenario layer
    # (every authored game moment, the combat fixture and the four
    # combat-load fixtures, at the stress profile, on all three seeds), plus
    # the 12 `combat-{profile}-{seed}` cases that run the combat fixture
    # under every authored network profile. This job exists only for the
    # twelve complete-fixture cases and the ten soak cases.
    #
    # That 54/12 split is COMPUTED and asserted by the native test itself,
    # not merely restated in comments like this one. An earlier draft here
    # said the native matrix added "twelve" cases, when its first loop pushes
    # TWO per (profile, seed) and so adds 24 -- an undercount that silently
    # left nine combat cases, at `clean`, `omp0_parity` and `playable`,
    # running only when a human pressed this button.
    #
    # The soak matrix here is NOT soak evidence: it takes no memory
    # measurement at all (see the test's doc comment). It runs so that the
    # suite is not a construct-only entry point; the memory-growth property
    # is #472's.
    #
    # ON DEMAND, NOT NIGHTLY, DELIBERATELY. There is no `schedule:` trigger
    # anywhere in .github/workflows/ today; creating one is #472's, which
    # owns the browser rollback stress/matrix/soak evidence and is blocked on
    # exactly that gap. Pointing this at a nightly that does not exist would
    # be the shape AGENTS.md §9 forbids -- a heading naming a run that never
    # happens. When #472 adds the scheduled workflow, this job should move
    # onto it.
    #
    # This job and the documented local invocation call the SAME script, so
    # they cannot drift (AGENTS.md §9's "prefer a shared scripts/check_*.sh
    # over hand-mirrored steps").
    rollback-native-matrix:
        name: Native rollback matrix (on demand)
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-24.04
        timeout-minutes: 45

        steps:
            - name: Check out source
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Install rustup if missing
              run: |
                  if ! command -v rustup >/dev/null 2>&1; then
                      curl --fail --location --retry 3 --silent --show-error \
                          https://sh.rustup.rs \
                          | sh -s -- -y --profile minimal --default-toolchain none
                      printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  fi

            - name: Select the pinned rust toolchain
              working-directory: rust
              run: rustup show

            # A gate that cannot fail is worse than no gate (AGENTS.md §9).
            # `cargo test -- --exact a_renamed_test` exits 0 having run
            # nothing, which is how this job could stay green while executing
            # none of the matrix -- #469's own defect, one layer down. This
            # proves the script's verdict logic rejects that and every other
            # shape of absent evidence. Seconds; runs no cargo.
            - name: Prove the native rollback gate detects failure
              run: ./scripts/check_rollback_native.sh --self-test

            - name: Run the complete native and soak rollback matrices
              run: ./scripts/check_rollback_native.sh

    # Posts (and keeps updated) one sticky comment on every pull request with
    # the fun-signature delta: base vs head fun score, every banded metric's
    # mean, and band residency. Report-only by design -- the VALUE is never a
    # gate (#633's dip was a correct trade); the enforced half lives in
    # check.sh's gate 0f (a moved signature owes a drift-log entry), which the
    # Gate (static) job already runs. Numbers come from the frozen baseline
    # RECORD, which the same CI run's baseline test proves equal to the live
    # simulation -- no extra matches are simulated here.
    fun-report:
        name: Fun signature report
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Check out source (with the base for comparison)
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0

            - name: Render the report
              id: render
              run: |
                  BASE="$(git merge-base HEAD origin/${{ github.event.pull_request.base.ref }})"
                  git show "$BASE:rust/crates/gc-data/src/outfield_ai_baseline.rs" > /tmp/baseline_base.rs
                  node scripts/check_fun_signature.mjs report \
                    --baseline rust/crates/gc-data/src/outfield_ai_baseline.rs \
                    --baseline-base /tmp/baseline_base.rs \
                    --bands rust/crates/gc-data/src/tunables.rs > /tmp/fun_report.md
                  cat /tmp/fun_report.md

            - name: Post or update the sticky comment
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
              with:
                  script: |
                      const fs = require("fs");
                      const body = fs.readFileSync("/tmp/fun_report.md", "utf8");
                      const marker = "<!-- fun-signature-report -->";
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        per_page: 100,
                      });
                      const mine = comments.find((c) => c.body && c.body.includes(marker));
                      if (mine) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: mine.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                        });
                      }
