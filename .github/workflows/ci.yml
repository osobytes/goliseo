name: CI

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:

permissions:
    actions: read
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # THE project gate. Everything it runs lives in scripts/check.sh, which
    # this job calls exactly as a contributor would locally, so the two
    # cannot drift (AGENTS.md §9's first rule: every gate in
    # scripts/check.sh must also appear here, and vice versa).
    gate:
        name: Gate
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        steps:
            - name: Check out source
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            # #432/#440/#454. The live-match harness driver's real output --
            # pixel captures, and the keeper-lean COUNTS that #449, #450 and
            # #451 turn on -- needs a browser and minutes of software GL, so
            # it runs by hand and a green line here is not evidence about the
            # renderer. Gated here: the driver's verdict rules, its
            # virtual-clock arithmetic, its bootstrap invariants, and above
            # all its ANTI-DRIFT checks. That driver mirrors two TypeScript
            # files in Python -- `frame_buffer.ts`'s per-player column
            # indices and wire pose ORDER, and `action_pose.ts`'s
            # `lateralSign` formula, its 1e-6 dead band and the SAVES table
            # -- and the self-test re-derives each from its source. A mirror
            # nothing re-derives silently stops matching while the counts it
            # produces stay plausible. Starts no browser.
            #
            # scripts/check.sh does not call this self-test itself, so it
            # stays its own step here rather than being folded in. If that
            # ever changes, this step becomes a duplicate and should be
            # deleted, per AGENTS.md §9.
            - name: Check the match harness driver logic and its TypeScript mirrors (starts no browser)
              run: python3 -B scripts/browser_match_harness.py --self-test

            # rust/rust-toolchain.toml pins the channel (1.93), the rustfmt
            # and clippy components, and the wasm32-unknown-unknown target.
            # rustup reads that file automatically for any cargo/rustc
            # invocation under rust/; `rustup show` below just forces the
            # download to happen here, as a named step, instead of silently
            # during the first `cargo fmt` inside check.sh. ubuntu-24.04
            # images ship rustup already; this only installs it if that ever
            # changes.
            - name: Install rustup if missing
              run: |
                  if ! command -v rustup >/dev/null 2>&1; then
                      curl --fail --location --retry 3 --silent --show-error \
                          https://sh.rustup.rs \
                          | sh -s -- -y --profile minimal --default-toolchain none
                      printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  fi

            - name: Select the pinned rust toolchain
              working-directory: rust
              run: rustup show

            # Pinned to exactly the version crates/gc-wasm/Cargo.toml
            # requires (`wasm-bindgen = "=0.2.118"`): the CLI checks its
            # generated glue against the crate's schema version exactly, not
            # semver, and a mismatch fails opaquely inside wasm-bindgen's own
            # codegen. wasm-bindgen's releases do not publish a checksums
            # file, so this hash was computed by hand from the published
            # asset -- the same way LOVE_SHA256 and STYLUA_SHA256 were pinned
            # for the deleted Lua toolchain, for the same reason.
            - name: Install pinned wasm-bindgen-cli
              env:
                  WASM_BINDGEN_VERSION: 0.2.118
                  WASM_BINDGEN_SHA256: 00b519c9fc2d6e087265da1a00f29160bfcc6a823993482bc2e691910287427b
              run: |
                  tool_dir="$RUNNER_TEMP/wasm-bindgen-cli"
                  mkdir -p "$tool_dir"
                  curl --fail --location --retry 3 --silent --show-error \
                      --output "$tool_dir/wasm-bindgen.tar.gz" \
                      "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
                  echo "${WASM_BINDGEN_SHA256}  $tool_dir/wasm-bindgen.tar.gz" | sha256sum --check --status
                  tar -xzf "$tool_dir/wasm-bindgen.tar.gz" -C "$tool_dir" --strip-components=1
                  chmod +x "$tool_dir/wasm-bindgen"
                  "$tool_dir/wasm-bindgen" --version
                  printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

            # ts/package.json "engines" requires >= 22; the redundant
            # determinism assertion inside check.sh additionally needs
            # `node --experimental-strip-types`, stable since Node 22.6.
            - name: Install pinned Node.js
              env:
                  NODE_VERSION: 22.22.0
                  NODE_SHA256: 9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37
              run: |
                  tool_dir="$RUNNER_TEMP/node"
                  mkdir -p "$tool_dir"
                  curl --fail --location --retry 3 --silent --show-error \
                      --output "$tool_dir/node.tar.xz" \
                      "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
                  echo "${NODE_SHA256}  $tool_dir/node.tar.xz" | sha256sum --check --status
                  tar -xJf "$tool_dir/node.tar.xz" -C "$tool_dir" --strip-components=1
                  "$tool_dir/bin/node" --version
                  printf '%s\n' "$tool_dir/bin" >> "$GITHUB_PATH"

            # Standalone binary, not resolved through any package manager:
            # this job must run exactly the pnpm version ts/package.json
            # ("packageManager": "pnpm@11.1.2") pins, not whatever corepack
            # or npm would otherwise resolve.
            - name: Install pinned pnpm
              env:
                  PNPM_VERSION: 11.1.2
                  PNPM_SHA256: f82f761572d9621c5a646ccc00a1ecec4cf5839d66b714497e6ca10cd2e086ee
              run: |
                  tool_dir="$RUNNER_TEMP/pnpm"
                  mkdir -p "$tool_dir"
                  curl --fail --location --retry 3 --silent --show-error \
                      --output "$tool_dir/pnpm.tar.gz" \
                      "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/pnpm-linux-x64.tar.gz"
                  echo "${PNPM_SHA256}  $tool_dir/pnpm.tar.gz" | sha256sum --check --status
                  tar -xzf "$tool_dir/pnpm.tar.gz" -C "$tool_dir"
                  chmod +x "$tool_dir/pnpm"
                  "$tool_dir/pnpm" --version
                  printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

            # A gate that cannot fail is worse than no gate (AGENTS.md §9).
            # This sabotages a set of hermetic, throwaway fixtures under
            # mktemp -- never the real rust or ts trees -- and requires every
            # one of them to be rejected, pinned to the message each targets,
            # before the real run below is trusted.
            - name: Prove the gate detects failure
              run: ./scripts/check.sh --self-test

            - name: Run the project gate
              run: ./scripts/check.sh

            # The one property no in-process fake can establish: two
            # INDEPENDENT wasm instances, connected by a real
            # RTCPeerConnection, deriving identical boundary hashes from real
            # asynchronously-delivered traffic. Every other online test in
            # this tree runs through fakes or a single instance, neither of
            # which can observe it.
            #
            # It also exercises net_inbox.rs's discipline -- JS enqueues,
            # Rust drains per tick, arrival is a tick event and never a
            # callback reaching sim state between ticks -- under REAL
            # callback timing.
            #
            # Same-engine Chrome only. The cross-engine Chrome/Firefox
            # variant needs both browser assets and is worth running less
            # often; it belongs on a schedule rather than on every push.
            - name: Install pinned browser evidence dependencies
              run: |
                  python3 -m venv "$RUNNER_TEMP/browser-evidence"
                  "$RUNNER_TEMP/browser-evidence/bin/pip" install \
                      --require-hashes \
                      --requirement scripts/browser_matrix-requirements.txt

            - name: Prove two real browser peers agree bit for bit
              run: |
                  "$RUNNER_TEMP/browser-evidence/bin/python" -B \
                      scripts/browser_online_peers.py \
                      --output "$RUNNER_TEMP/online-peers.json"

            - name: Publish the agreement evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: online-peers
                  path: ${{ runner.temp }}/online-peers.json
                  if-no-files-found: warn

    # #469. The COMPLETE OMP-2 native rollback validation matrix (nine
    # authored game moments x four network profiles x three seeds, 66 cases,
    # including twelve 7,201-tick complete-fixture runs) and the ten-case
    # soak matrix. No browser, no GPU, no display -- pure CPU inside
    # `cargo test`.
    #
    # WHY THIS IS A SEPARATE JOB AND NOT PART OF `gate`. Measured in a debug
    # build on one local machine: 325.9s for the native matrix's 66 cases, of
    # which the twelve complete-fixture cases are 310.2s; 140.7s more for the
    # soak matrix. The remaining 54 native cases -- every authored game
    # moment, the combat fixture and the four combat-load fixtures, at the
    # stress profile, on all three seeds -- cost 11.2s and therefore DO run
    # on every PR, as an ordinary un-ignored test inside
    # `cargo test --workspace` in scripts/check.sh. This job exists only for
    # the expensive seventeen.
    #
    # The soak matrix here is NOT soak evidence: it takes no memory
    # measurement at all (see the test's doc comment). It runs so that the
    # suite is not a construct-only entry point; the memory-growth property
    # is #472's.
    #
    # ON DEMAND, NOT NIGHTLY, DELIBERATELY. There is no `schedule:` trigger
    # anywhere in .github/workflows/ today; creating one is #472's, which
    # owns the browser rollback stress/matrix/soak evidence and is blocked on
    # exactly that gap. Pointing this at a nightly that does not exist would
    # be the shape AGENTS.md §9 forbids -- a heading naming a run that never
    # happens. When #472 adds the scheduled workflow, this job should move
    # onto it.
    #
    # This job and the documented local invocation call the SAME script, so
    # they cannot drift (AGENTS.md §9's "prefer a shared scripts/check_*.sh
    # over hand-mirrored steps").
    rollback-native-matrix:
        name: Native rollback matrix (on demand)
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-24.04
        timeout-minutes: 45

        steps:
            - name: Check out source
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Install rustup if missing
              run: |
                  if ! command -v rustup >/dev/null 2>&1; then
                      curl --fail --location --retry 3 --silent --show-error \
                          https://sh.rustup.rs \
                          | sh -s -- -y --profile minimal --default-toolchain none
                      printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  fi

            - name: Select the pinned rust toolchain
              working-directory: rust
              run: rustup show

            # A gate that cannot fail is worse than no gate (AGENTS.md §9).
            # `cargo test -- --exact a_renamed_test` exits 0 having run
            # nothing, which is how this job could stay green while executing
            # none of the matrix -- #469's own defect, one layer down. This
            # proves the script's verdict logic rejects that and every other
            # shape of absent evidence. Seconds; runs no cargo.
            - name: Prove the native rollback gate detects failure
              run: ./scripts/check_rollback_native.sh --self-test

            - name: Run the complete native and soak rollback matrices
              run: ./scripts/check_rollback_native.sh
